<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2d1e"/>
      <stop offset="1" stop-color="#221206"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#d9cdb4"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38302a"/>
      <stop offset="1" stop-color="#0c0805"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6bd68"/>
      <stop offset="1" stop-color="#9c7429"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bg)"/>
  <rect x="36" y="36" width="952" height="952" rx="226" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="7"/>
  <!-- equalizer bars: MIDI in, music out -->
  <g fill="url(#brass)">
    <rect x="206" y="316" width="74" height="200" rx="37"/>
    <rect x="312" y="246" width="74" height="270" rx="37"/>
    <rect x="418" y="168" width="74" height="348" rx="37"/>
    <rect x="524" y="250" width="74" height="266" rx="37"/>
    <rect x="630" y="322" width="74" height="194" rx="37"/>
    <rect x="736" y="382" width="74" height="134" rx="37"/>
  </g>
  <!-- red felt strip -->
  <rect x="152" y="576" width="720" height="28" rx="8" fill="#a31621"/>
  <!-- white keys -->
  <g fill="url(#ivory)" stroke="#8a7d63" stroke-width="4">
    <rect x="152" y="604" width="180" height="268" rx="14"/>
    <rect x="332" y="604" width="180" height="268" rx="14"/>
    <rect x="512" y="604" width="180" height="268" rx="14"/>
    <rect x="692" y="604" width="180" height="268" rx="14"/>
  </g>
  <!-- black keys -->
  <g fill="url(#ebony)">
    <rect x="282" y="604" width="100" height="160" rx="10"/>
    <rect x="462" y="604" width="100" height="160" rx="10"/>
  </g>
</svg>
